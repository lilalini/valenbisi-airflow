x-airflow-comun: &airflow-comun
  image: valenbisi-airflow       # nuestra imagen
  build: .                       # se construye con el Dockerfile
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@metadatos/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    metadatos: {condition: service_healthy}

services:
  metadatos:               # base de datos de Airflow
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - metadatos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  valenbisi-db:            # destino del ETL
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

  airflow-init:            # prepara metadatos y termina
    <<: *airflow-comun
    command: db migrate

  airflow-apiserver:       # web y API en el 8080
    <<: *airflow-comun
    command: api-server
    ports:
      - "8080:8080"
    depends_on: &espera-init
      metadatos: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}

  airflow-scheduler:       # planifica y ejecuta
    <<: *airflow-comun
    command: scheduler
    depends_on: *espera-init

  airflow-dag-processor:   # lee dags/
    <<: *airflow-comun
    command: dag-processor
    depends_on: *espera-init

volumes:
  metadatos:
  pgdata:

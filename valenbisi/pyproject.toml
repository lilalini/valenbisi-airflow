[project]
name = "valenbisi"
version = "0.1.0"
description = "Funciones del ETL de Valenbisi"
readme = "README.md"
authors = [
    { name = "Eugenia", email = "eugkosess@alu.edu.gva.es" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "requests>=2.34.2",
]
